name: CI Build

on:
  push:
    branches: [main, simulated-ie]
  pull_request:
    branches: [main, simulated-ie]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21, NeoForge)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx6G -Dorg.gradle.daemon=false"

      - name: Verify build output
        run: |
          ls -la build/libs/
          if [ -f build/libs/AeroIE-*.jar ]; then
            echo "BUILD_JAR=$(ls build/libs/AeroIE-*.jar | head -1)" >> $GITHUB_ENV
            echo "Build successful: $(ls build/libs/AeroIE-*.jar)"
          else
            echo "No AeroIE JAR found in build/libs/"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroIE-${{ github.sha }}
          path: |
            build/libs/AeroIE-*.jar
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            **/build/reports/**/*
            **/build/test-results/**/*
          retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4G -Dorg.gradle.daemon=false"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/test-results/**/*
            **/build/reports/tests/**/*
          retention-days: 7